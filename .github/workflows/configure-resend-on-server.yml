name: One-time configure Resend on Singapore server

on:
  workflow_dispatch:
  issues:
    types: [opened]
  push:
    branches: [main]
    paths:
      - ".github/workflows/configure-resend-on-server.yml"
      - "deploy/secure-transfer/resend-api-key.enc"

permissions:
  contents: write

concurrency:
  group: lifemirror-singapore-production
  cancel-in-progress: false

jobs:
  configure:
    if: github.event_name != 'issues' || github.event.issue.title == 'LifeMirror ops: prepare Resend 2026-08-15'
    name: Securely configure email service
    runs-on: [self-hosted, linux, x64, lifemirror, prod]
    env:
      DEPLOY_DIR: /home/github-runner/lifemirror-production
      TRANSFER_DIR: /home/github-runner/lifemirror-production/.secret-transfer
      PAYLOAD_FILE: deploy/secure-transfer/resend-api-key.enc
      PUBLIC_FILE: deploy/secure-transfer/server-public.pem
      MARKER_FILE: deploy/secure-transfer/resend-configured.txt
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare one-time encryption key
        if: ${{ hashFiles('deploy/secure-transfer/resend-api-key.enc') == '' }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$TRANSFER_DIR"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$TRANSFER_DIR/private.pem"
          chmod 600 "$TRANSFER_DIR/private.pem"
          openssl pkey -in "$TRANSFER_DIR/private.pem" -pubout -out "$TRANSFER_DIR/public.pem"
          install -d -m 755 "$(dirname "$PUBLIC_FILE")"
          install -m 644 "$TRANSFER_DIR/public.pem" "$PUBLIC_FILE"
          git config user.name "LifeMirror Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$PUBLIC_FILE"
          git commit -m "chore: publish one-time server encryption key"
          git push origin HEAD:main

      - name: Decrypt and install Resend configuration
        if: ${{ hashFiles('deploy/secure-transfer/resend-api-key.enc') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          PRIVATE_KEY="$TRANSFER_DIR/private.pem"
          SERVER_PUBLIC_KEY="$TRANSFER_DIR/public.pem"
          test -f "$PRIVATE_KEY"
          test -f "$DEPLOY_DIR/.env.production"
          secret_file="$(mktemp)"
          response_file="$(mktemp)"
          cleanup() {
            rm -f "$secret_file" "$response_file" "$PRIVATE_KEY" "$SERVER_PUBLIC_KEY"
          }
          trap cleanup EXIT
          base64 -d < "$PAYLOAD_FILE" | openssl pkeyutl -decrypt             -inkey "$PRIVATE_KEY"             -pkeyopt rsa_padding_mode:oaep             -pkeyopt rsa_oaep_md:sha256             -out "$secret_file"
          grep -Eq '^re_[[:alnum:]_-]+$' "$secret_file"

          python3 - "$DEPLOY_DIR/.env.production" "$secret_file" <<'PY'
          import os
          import pathlib
          import sys
          import tempfile

          env_path = pathlib.Path(sys.argv[1])
          secret_path = pathlib.Path(sys.argv[2])
          secret = secret_path.read_text(encoding="utf-8").strip()
          replacements = {
              "RESEND_API_KEY": secret,
              "EMAIL_FROM": "'LifeMirror <login@auth.lumeword.com>'",
          }
          seen = set()
          output = []
          for line in env_path.read_text(encoding="utf-8").splitlines():
              key = line.split("=", 1)[0] if "=" in line else ""
              if key in replacements:
                  output.append(f"{key}={replacements[key]}")
                  seen.add(key)
              else:
                  output.append(line)
          for key, value in replacements.items():
              if key not in seen:
                  output.append(f"{key}={value}")
          fd, tmp_name = tempfile.mkstemp(prefix=".env.production.", dir=str(env_path.parent))
          try:
              with os.fdopen(fd, "w", encoding="utf-8") as handle:
                  handle.write("\n".join(output) + "\n")
              os.chmod(tmp_name, 0o600)
              os.replace(tmp_name, env_path)
          finally:
              if os.path.exists(tmp_name):
                  os.unlink(tmp_name)
          PY

          cd "$DEPLOY_DIR"
          docker compose --env-file .env.production -f docker-compose.production.yml             up -d --no-deps --force-recreate api

          for attempt in $(seq 1 30); do
            state="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' lifemirror-production-api-1 2>/dev/null || true)"
            if [ "$state" = "healthy" ]; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "API did not become healthy after email configuration"
              exit 1
            fi
            sleep 2
          done

          resend_key="$(tr -d '\r\n' < "$secret_file")"
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}'             --request POST 'https://api.resend.com/emails'             --header "Authorization: Bearer $resend_key"             --header 'Content-Type: application/json'             --data '{"from":"LifeMirror <login@auth.lumeword.com>","to":["delivered@resend.dev"],"subject":"LifeMirror email configuration verification","text":"LifeMirror email delivery is configured."}')"
          case "$status" in
            200|201|202) ;;
            *)
              echo "Resend verification failed with HTTP $status"
              exit 1
              ;;
          esac

          cd "$GITHUB_WORKSPACE"
          install -d -m 755 "$(dirname "$MARKER_FILE")"
          {
            echo "configured_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "verification_http_status=$status"
          } > "$MARKER_FILE"
          git config user.name "LifeMirror Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$MARKER_FILE"
          git commit -m "chore: confirm Resend server configuration"
          git push origin HEAD:main
