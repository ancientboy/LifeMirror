name: Deploy LifeMirror Singapore

on:
  workflow_dispatch:
    inputs:
      migrate_legacy_d1:
        description: "Run the one-time D1 to PostgreSQL transfer after both migration secrets are configured"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lifemirror-singapore-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy production
    runs-on: [self-hosted, linux, x64, lifemirror, prod]
    env:
      DEPLOY_DIR: /home/github-runner/lifemirror-production
      SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Refresh deploy source
        shell: bash
        run: |
          mkdir -p "$DEPLOY_DIR"
          tar --exclude-vcs --exclude=node_modules --exclude=.env.production -cf - . | tar -xf - -C "$DEPLOY_DIR"

      - name: Verify server configuration
        shell: bash
        run: |
          test -f "$DEPLOY_DIR/.env.production" || {
            echo "Missing $DEPLOY_DIR/.env.production. Run: cp $DEPLOY_DIR/.env.production.example $DEPLOY_DIR/.env.production, then fill in real values."
            exit 1
          }
          docker version --format '{{.Server.Version}}'
          docker compose version

      - name: Build, migrate, and restart
        shell: bash
        run: |
          cd "$DEPLOY_DIR"
          export SOURCE_COMMIT
          docker compose --env-file .env.production -f docker-compose.production.yml up -d --build --remove-orphans
          docker compose --env-file .env.production -f docker-compose.production.yml ps

      - name: Transfer legacy D1 data
        # This commit runs the user-authorized one-time legacy transfer; remove the push trigger after success.
        if: ${{ inputs.migrate_legacy_d1 == true || github.event.head_commit.message == 'Run legacy D1 transfer now' }}
        shell: bash
        run: |
          cd "$DEPLOY_DIR"
          set -a
          . ./.env.production
          set +a
          test -n "${D1_MIGRATION_TOKEN:-}" || { echo "D1_MIGRATION_TOKEN is missing from .env.production"; exit 1; }
          run_id="d1-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}"
          response_file="$(mktemp)"
          response_status="$(curl --show-error --silent --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --header "x-lifemirror-migration-token: $D1_MIGRATION_TOKEN" \
            "https://lifemirror.yellow-mole-5128.chatgpt.site/api/internal/migration/v1/export?runId=$run_id")"
          cat "$response_file"
          echo
          test "$response_status" -ge 200 && test "$response_status" -lt 300 || {
            echo "Legacy export failed with HTTP $response_status"
            exit 1
          }
          status="$(curl --fail --show-error --silent \
            --header "x-lifemirror-migration-token: $D1_MIGRATION_TOKEN" \
            "https://beta.lumeword.com/api/internal/migration/v1/status/$run_id")"
          node --input-type=module -e '
            const status = JSON.parse(process.argv[1]);
            if (status.run?.status !== "completed") throw new Error("legacy migration did not complete");
            const actual = Object.fromEntries((status.tables || []).map((row) => [row.source_table, Number(row.rows)]));
            for (const [table, expected] of Object.entries(status.run.source_counts || {})) {
              if ((actual[table] || 0) !== Number(expected)) throw new Error(`row count mismatch for ${table}`);
            }
            console.log(JSON.stringify({ runId: status.run.run_id, receivedRows: status.run.received_rows, verifiedTables: Object.keys(status.run.source_counts || {}).length }));
          ' "$status"