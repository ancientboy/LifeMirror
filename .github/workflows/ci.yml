name: Life Mirror CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      WEB_ORIGIN: http://localhost:4173
      LLM_PROVIDER: disabled
      REFLECTION_TOKEN_SECRET: integration-reflection-secret-at-least-32-chars
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build Sites Worker and static app
        run: npm run build
      - name: Verify D1 Worker release contract
        run: npm run test:worker
      - name: Build API container
        run: docker build --build-arg SOURCE_COMMIT="$GITHUB_SHA" -f deploy/api.Dockerfile .
